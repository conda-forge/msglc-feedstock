schema_version: 1

context:
  version: "261017"

package:
  name: msglc
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/msglc/msglc-${{ version }}.tar.gz
  sha256: 64b5589fbf968b2adc6e8b52e840c5cc3ea478211ea9999e58658f0408920975

build:
  number: 0
  skip: match(python, "<3.11")
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler("rust") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1
    - cython
    - pip
    - puccinialin
  run:
    - python
    - bitarray
    - cbor2
    - msgpack-python >=1
    - universal-pathlib

tests:
  - python:
      imports:
        - msglc
      pip_check: true

about:
  summary: binary json representation (msgpack or cbor) with lazy/partial loading containers
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/TLCFEM/msglc
  repository: https://github.com/TLCFEM/msglc

extra:
  recipe-maintainers:
    - jan-janssen
